<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400&family=Archivo:wght@400;600;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FFFFFF; --ink: #0A0A0A; --gray: #6B6B6B; --accent: #FFD400; --card: #F2F2F2;
    --a0: #E23D3D; --a1: #2B6BE0; --a2: #F2B400; --a3: #2E9E5B;
    --display: "Newsreader", "Iowan Old Style", Georgia, serif;
    --font: "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --mono: "Space Mono", ui-monospace, Menlo, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; border-radius: 0 !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  #app { min-height: 100%; display: flex; flex-direction: column; padding: 4vmin; gap: 3vmin; }
  h1 { margin: 0; line-height: 1; font-family: var(--display); font-weight: 500; letter-spacing: -0.02em; }
  code { font-family: var(--mono); background: var(--card); padding: 0.1em 0.35em; font-size: 0.9em; }
  .muted { color: var(--gray); }
  button {
    font: inherit; font-weight: 600; border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
    padding: 0.6em 1.2em; cursor: pointer; background: var(--accent); color: var(--ink);
  }
  button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
  button:disabled { opacity: 0.4; cursor: default; }
  input[type=text] { font: inherit; padding: 0.6em 0.8em; border: 3px solid var(--ink); background: var(--paper); color: var(--ink); width: 100%; }
  .row { display: flex; gap: 1em; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .center { text-align: center; align-items: center; justify-content: center; }
  .banner { border: 3px solid var(--ink); border-left: 14px solid var(--accent); padding: 0.6em 1em; font-size: 0.85em; }
  .level { display: inline-block; font-family: var(--mono); font-size: 0.6em; letter-spacing: 0.12em; text-transform: uppercase; background: var(--ink); color: var(--paper); padding: 0.25em 0.7em; }
  .fsbtn {
    position: fixed; bottom: 4vmin; right: 4vmin; z-index: 5; font-family: var(--mono); font-size: 0.7rem; font-weight: 400;
    text-transform: uppercase; letter-spacing: 0.08em; background: var(--paper); border-width: 2px; box-shadow: none; padding: 0.4em 0.9em;
  }
  .fsbtn:hover { background: var(--ink); color: var(--paper); }
  :fullscreen .fsbtn { display: none; }

  /* answers grid, shared by host and player */
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5vmin; flex: 1; padding-right: 5px; padding-bottom: 5px; }
  .ans {
    display: flex; align-items: center; gap: 0.5em; padding: 1em; color: #fff; border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink);
    font-weight: 600; font-size: 1.1em; line-height: 1.2; text-align: left; min-height: 4em; transition: opacity 200ms;
  }
  .ans .shape { font-size: 1.4em; width: 1.4em; text-align: center; flex-shrink: 0; }
  .ans.c0 { background: var(--a0); } .ans.c1 { background: var(--a1); }
  .ans.c2 { background: var(--a2); color: var(--ink); } .ans.c3 { background: var(--a3); }
  .ans.dim { opacity: 0.2; }
  .ans.correct { outline: 5px solid var(--ink); outline-offset: 4px; }
  .ans .count { margin-left: auto; font-family: var(--mono); font-size: 1.3em; }
  button.ans:active { transform: translate(2px, 2px); box-shadow: 3px 3px 0 var(--ink); }

  /* host */
  .host { font-size: calc(1rem + 1.2vmin); }
  .host h1 { font-size: 2.6em; }
  .host .question { font-family: var(--display); font-weight: 500; font-size: 2em; letter-spacing: -0.02em; line-height: 1.05; text-wrap: balance; }
  .code { font-family: var(--font); font-weight: 900; font-size: 4.5em; letter-spacing: 0.08em; line-height: 1; color: var(--accent); -webkit-text-stroke: 2px var(--ink); }
  .qr { background: #fff; padding: 12px; border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); display: inline-block; }
  .qr img, .qr canvas { display: block; }
  .players { display: flex; flex-wrap: wrap; gap: 0.5em; }
  .chip { border: 2px solid var(--ink); padding: 0.2em 0.7em; font-family: var(--mono); font-size: 0.7em; }
  .timer { height: 14px; border: 3px solid var(--ink); overflow: hidden; }
  .timer div { height: 100%; background: var(--accent); width: 100%; transform-origin: left; }
  .timer.run div { animation: shrink linear forwards; }
  @keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  .board { display: grid; grid-template-columns: auto 1fr auto; gap: 0.4em 1em; font-size: 0.9em; align-items: center; }
  .board b { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .bar { height: 0.9em; background: var(--accent); border: 2px solid var(--ink); min-width: 4px; }
  .podium { display: flex; gap: 3vmin; align-items: flex-end; justify-content: center; flex: 1; padding: 0 8px 8px 0; }
  .podium > div { border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); background: var(--paper); padding: 1em; text-align: center; width: 28%; display: flex; flex-direction: column; justify-content: flex-end; gap: 0.2em; }
  .podium .p1 { height: 60%; background: var(--accent); } .podium .p2 { height: 45%; } .podium .p3 { height: 35%; }
  .podium .name { font-family: var(--display); font-weight: 500; font-size: 1.4em; line-height: 1.05; overflow-wrap: anywhere; }
  .podium .place { font-family: var(--mono); font-size: 0.7em; text-transform: uppercase; letter-spacing: 0.1em; }
  .podium .pts { font-family: var(--mono); }
  .hint { font-family: var(--mono); font-size: 0.55em; color: var(--gray); margin-top: auto; }
  .rt-board { display: grid; grid-template-columns: auto 1fr auto; gap: 0.3em 1em; font-size: 0.9em; align-items: center; }
  .rt-board b { font-family: var(--mono); }

  /* player */
  .player { font-size: 1.15rem; }
  .player h1 { font-size: 2em; }
  .player .answers { min-height: 60vh; }
  .player .ans { font-size: 1.05em; min-height: 5em; }
  .player .question { font-family: var(--display); font-size: 1.25em; font-weight: 500; line-height: 1.1; }
  .big { font-family: var(--font); font-weight: 900; font-size: 3.2em; line-height: 1; letter-spacing: -0.03em; }
  .result { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 0.5em; text-align: center; padding: 1em; border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); margin-right: 6px; margin-bottom: 6px; }
  .result.ok { background: var(--a3); color: #fff; } .result.no { background: var(--a0); color: #fff; }
  .result.wait { background: var(--paper); }

  /* reaction round (player) */
  .rt {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 55vh;
    border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); margin-right: 6px; margin-bottom: 6px;
    background: var(--card); cursor: pointer; user-select: none; -webkit-user-select: none; font-size: 1.4em; text-align: center; padding: 1em;
  }
  .rt.waiting { background: var(--ink); color: var(--paper); }
  .rt.go { background: var(--a3); color: #fff; }
  .rt small { display: block; font-size: 0.6em; opacity: 0.8; margin-top: 0.5em; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ============================================================================
// CONFIG
//
// Transport, picked automatically (override with ?transport=peer|local|firebase):
//   peer     - default when the page is served over http(s). Phones connect
//              directly to the host's browser (WebRTC via the public PeerJS
//              signaling server). No account, no backend.
//   local    - default on localhost or file://. Host and players must be tabs
//              in the SAME browser (BroadcastChannel). For trying it out.
//   firebase - used when FIREBASE_CONFIG is set. Most robust on locked-down
//              networks. See QUIZ.md.
// ============================================================================
const FIREBASE_CONFIG = null;

const QUESTION_SECONDS = 20;
const SHAPES = ['▲', '◆', '●', '■']; // ▲ ◆ ● ■
const REACTION_SECONDS = 30;
const reactionPoints = ms => Math.round(Math.min(1000, 250000 / Math.max(ms, 1))); // 250 ms = 1000 points
</script>

<script>
(async () => {
  const app = document.getElementById('app');
  const params = new URLSearchParams(location.search);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const loadScript = src => new Promise((ok, err) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = err; document.head.appendChild(s); });

  // ---------------------------------------------------------------- transport
  // Every peer sends messages on a shared bus and hears everyone else's.
  // The host also keeps a "state" doc so late joiners can catch up.
  function pickTransport() {
    const forced = params.get('transport');
    if (forced) return forced;
    if (FIREBASE_CONFIG) return 'firebase';
    if (location.protocol === 'file:' || /^(localhost|127\.)/.test(location.hostname)) return 'local';
    return 'peer';
  }

  async function makeBus(code, role) {
    const transport = pickTransport();
    if (transport === 'peer') {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js');
      const hostId = 'hlthquiz-' + code;
      const listeners = [];
      const emit = m => listeners.forEach(cb => cb(m));
      if (role === 'host') {
        const conns = new Set();
        let state = null;
        const peer = new Peer(hostId);
        await new Promise((ok, err) => { peer.on('open', ok); peer.on('error', e => e.type === 'unavailable-id' ? err(new Error('Room code ' + code + ' is already in use. Reload for a new one.')) : console.warn('peer', e)); });
        peer.on('connection', c => {
          c.on('open', () => { conns.add(c); c.send({ t: 'state', s: state }); });
          c.on('data', emit);
          c.on('close', () => conns.delete(c));
          c.on('error', () => conns.delete(c));
        });
        return {
          mode: 'peer',
          send: m => conns.forEach(c => c.open && c.send(m)),
          on: cb => listeners.push(cb),
          setState: s => { state = s; },
          getState: async () => state,
        };
      }
      // player: connect to the host, reconnect if the channel drops
      let conn = null, lastJoin = null, stateResolve = null;
      const statePromise = new Promise(r => stateResolve = r);
      const peer = new Peer();
      await new Promise(ok => peer.on('open', ok));
      const connect = () => {
        conn = peer.connect(hostId, { reliable: true });
        conn.on('open', () => { if (lastJoin) conn.send(lastJoin); });
        conn.on('data', m => { if (m.t === 'state') stateResolve(m.s); else emit(m); });
        const retry = () => setTimeout(connect, 1500);
        conn.on('close', retry);
        conn.on('error', retry);
      };
      connect();
      return {
        mode: 'peer',
        send: m => { if (m.t === 'join') lastJoin = m; if (conn && conn.open) conn.send(m); },
        on: cb => listeners.push(cb),
        setState: () => {},
        getState: () => Promise.race([statePromise, new Promise(r => setTimeout(() => r(null), 4000))]),
      };
    }
    if (transport === 'firebase') {
      await loadScript('https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js');
      firebase.initializeApp(FIREBASE_CONFIG);
      const root = firebase.database().ref('rooms/' + code);
      const msgs = root.child('msgs');
      const startKey = msgs.push().key; // only hear messages from now on
      return {
        mode: 'firebase',
        send: m => msgs.push(m),
        on: cb => msgs.orderByKey().startAt(startKey).on('child_added', s => cb(s.val())),
        setState: s => root.child('state').set(s),
        getState: () => root.child('state').once('value').then(s => s.val()),
      };
    }
    const ch = new BroadcastChannel('quiz-' + code);
    const key = 'quiz-state-' + code;
    return {
      mode: 'local',
      send: m => ch.postMessage(m),
      on: cb => ch.addEventListener('message', e => cb(e.data)),
      setState: s => localStorage.setItem(key, JSON.stringify(s)),
      getState: async () => JSON.parse(localStorage.getItem(key) || 'null'),
    };
  }

  const answerButton = (i, text, extra = '') =>
    `<div class="ans c${i} ${extra}"><span class="shape">${SHAPES[i]}</span><span>${esc(text)}</span></div>`;

  // ================================================================== PLAYER
  async function runPlayer(code) {
    document.body.classList.add('player');
    const bus = await makeBus(code, 'player');
    // identity survives a page refresh via window.name (per tab, not shared)
    let saved = {}; try { saved = JSON.parse(window.name || '{}'); } catch {}
    let id = saved.id || Math.random().toString(36).slice(2, 10);
    let name = saved.name || '';
    const remember = () => window.name = JSON.stringify({ id, name });
    remember();
    let current = null;   // current question message
    let answered = null;  // choice index for current question
    let joined = false;

    const render = html => app.innerHTML = html;

    function showJoin() {
      render(`
        <h1>Join the quiz</h1>
        <p class="muted">Room <b>${esc(code)}</b></p>
        <input type="text" id="name" placeholder="Your name" maxlength="20" value="${esc(name)}" autofocus>
        <button id="go">Join</button>`);
      const go = () => {
        name = document.getElementById('name').value.trim().slice(0, 20);
        if (!name) return;
        remember();
        bus.send({ t: 'join', id, name });
        render(`<div class="result wait"><div class="muted">Connecting as</div><div class="big" style="font-size:2em">${esc(name)}</div></div>`);
      };
      document.getElementById('go').onclick = go;
      document.getElementById('name').onkeydown = e => { if (e.key === 'Enter') go(); };
    }

    function showWaiting(msg = 'Watch the screen') {
      render(`<div class="result wait"><div class="muted">You're in as</div><div class="big" style="font-size:2em">${esc(name)}</div><p>${msg}</p></div>`);
    }

    function showReaction(q) {
      current = q; answered = null;
      render(`
        <div class="row"><span class="muted">Round ${q.n + 1} of ${q.total}</span><span class="level">Reaction</span></div>
        <div class="question">${esc(q.text)}</div>
        <div class="rt" id="rt">Tap to start<small>When this box turns green, tap it as fast as you can</small></div>`);
      const box = document.getElementById('rt');
      let state = 'idle', timer = null, t0 = 0;
      box.addEventListener('click', () => {
        if (state === 'idle') {
          state = 'waiting'; box.className = 'rt waiting'; box.innerHTML = 'Wait for it...';
          timer = setTimeout(() => { state = 'go'; t0 = performance.now(); box.className = 'rt go'; box.innerHTML = 'TAP'; }, 1200 + Math.random() * 3000);
        } else if (state === 'waiting') {
          clearTimeout(timer); state = 'idle'; box.className = 'rt'; box.innerHTML = 'Too early!<small>Tap to try again</small>';
        } else if (state === 'go') {
          const ms = Math.round(performance.now() - t0); state = 'done'; answered = ms;
          bus.send({ t: 'answer', id, q: q.n, ms });
          render(`<div class="result wait"><div class="big">${ms} ms</div><p>Locked in.</p><p class="muted">Waiting for everyone else...</p></div>`);
        }
      });
    }

    function showQuestion(q) {
      if (q.type === 'reaction') return showReaction(q);
      current = q; answered = null;
      render(`
        <div class="row"><span class="muted">Question ${q.n + 1} of ${q.total}</span>${q.level ? `<span class="level">${esc(q.level)}</span>` : ''}</div>
        <div class="question">${esc(q.text)}</div>
        <div class="answers">${q.choices.map((c, i) => answerButton(i, c).replace('<div', '<button data-i="' + i + '"').replace(/<\/div>$/, '</button>')).join('')}</div>`);
      app.querySelectorAll('button.ans').forEach(b => b.onclick = () => {
        answered = +b.dataset.i;
        bus.send({ t: 'answer', id, q: q.n, choice: answered });
        render(`<div class="result wait"><div class="big" style="font-size:2em">${SHAPES[answered]}</div><p>Answer locked in.</p><p class="muted">Waiting for everyone else...</p></div>`);
      });
    }

    function showReveal(m) {
      const r = m.results[id];
      if (!r) { showWaiting('You missed that one. Next question soon.'); return; }
      if (m.type === 'reaction') {
        render(`
          <div class="result ${r.ms ? 'ok' : 'no'}">
            <div class="big">${r.ms ? r.ms + ' ms' : 'No tap'}</div>
            <div style="font-size:1.6em">+${r.points}</div>
            <div>Class average: ${m.avg} ms &middot; fastest: ${m.best} ms</div>
            <div style="opacity:0.85">You're #${r.rank} with ${r.score} points</div>
          </div>`);
        return;
      }
      render(`
        <div class="result ${r.correct ? 'ok' : 'no'}">
          <div class="big">${r.correct ? 'Correct!' : 'Nope'}</div>
          <div style="font-size:1.6em">+${r.points}</div>
          <div>Answer: ${SHAPES[m.correct]} ${esc(m.choices[m.correct])}</div>
          <div style="opacity:0.85">You're #${r.rank} with ${r.score} points</div>
        </div>`);
    }

    function showEnd(m) {
      const r = m.results[id];
      render(`
        <div class="result wait">
          <div class="muted">Final result</div>
          <div class="big">#${r ? r.rank : '-'}</div>
          <div style="font-size:1.3em">${esc(name)} &middot; ${r ? r.score : 0} points</div>
          <p class="muted">Thanks for playing.</p>
        </div>`);
    }

    bus.on(m => {
      if (m.t === 'welcome' && m.id === id) { if (!joined) { joined = true; showWaiting(); } }
      else if (m.t === 'question') { if (!joined) { joined = true; } showQuestion(m); }
      else if (m.t === 'reveal') showReveal(m);
      else if (m.t === 'end') showEnd(m);
      else if (m.t === 'lobby' && joined) showWaiting();
    });

    if (name) {
      // returning player (refresh): rejoin silently and catch up
      joined = true;
      bus.send({ t: 'join', id, name });
      const st = await bus.getState();
      if (st && st.t === 'question') showQuestion(st); else showWaiting();
    } else {
      showJoin();
    }
  }

  // ==================================================================== HOST
  async function runHost() {
    document.body.classList.add('host');
    const deck = params.get('deck');
    if (!deck) {
      app.innerHTML = `<h1>Quiz host</h1><p>Add <code>?deck=NAME</code> to the URL, where <code>quizzes/NAME.js</code> exists.</p>
        <p class="muted">Example: <code>quiz.html?deck=sleep</code></p>`;
      return;
    }
    try { await loadScript('quizzes/' + deck + '.js'); } catch { app.innerHTML = `<h1>Couldn't load quizzes/${esc(deck)}.js</h1>`; return; }
    const Q = window.QUIZ;
    const questions = Q.questions;

    const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
    const code = params.get('room') || Array.from({ length: 4 }, () => letters[Math.floor(Math.random() * letters.length)]).join('');
    let bus;
    try { bus = await makeBus(code, 'host'); } catch (e) { app.innerHTML = `<h1>${esc(e.message)}</h1>`; return; }
    const joinUrl = location.origin + location.pathname + '?room=' + code + (params.get('transport') ? '&transport=' + params.get('transport') : '');

    const players = {};   // id -> {name, score}
    let phase = 'lobby', qi = -1, qStart = 0, answers = {}, timer = null;
    const cur = () => questions[qi];
    const dur = () => (cur().time || (cur().type === 'reaction' ? REACTION_SECONDS : QUESTION_SECONDS)) * 1000;

    const render = html => app.innerHTML = html;
    document.body.insertAdjacentHTML('beforeend', '<button class="fsbtn" onclick="document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()">Fullscreen</button>');
    const ranked = () => Object.entries(players).map(([id, p]) => ({ id, ...p })).sort((a, b) => b.score - a.score);
    const resultsFor = () => {
      const out = {}; ranked().forEach((p, i) => out[p.id] = { rank: i + 1, score: p.score, points: p.points || 0, correct: !!p.correct, ms: p.ms || null });
      return out;
    };

    function lobby() {
      phase = 'lobby';
      bus.setState({ t: 'lobby' });
      render(`
        <div class="row" style="align-items:flex-start">
          <div class="grow">
            <h1>${esc(Q.title || 'Quiz')}</h1>
            <p class="muted">Scan the code or go to<br><code>${esc(joinUrl)}</code></p>
            ${location.protocol === 'file:' ? '<div class="banner">This page is opened from a file, so phones can\'t reach it. Host it (see QUIZ.md).</div>' : ''}
            ${bus.mode === 'local' ? '<div class="banner">Test mode: players must be tabs in this same browser. Serve the page from a real URL for phones.</div>' : ''}
            ${bus.mode === 'peer' ? '<div class="banner">Keep this tab open. Phones connect straight to it.</div>' : ''}
            <p>Room code</p><div class="code">${code}</div>
          </div>
          <div class="qr" id="qr"></div>
        </div>
        <div class="players" id="players"></div>
        <div class="row"><button id="start" disabled>Start</button><span class="muted" id="n">Waiting for players...</span></div>
        <div class="hint">Space or Enter = start / next question</div>`);
      loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js')
        .then(() => new QRCode(document.getElementById('qr'), { text: joinUrl, width: 220, height: 220 }))
        .catch(() => document.getElementById('qr').textContent = 'QR unavailable');
      document.getElementById('start').onclick = next;
      renderPlayers();
    }

    function renderPlayers() {
      const list = document.getElementById('players'); if (!list) return;
      list.innerHTML = ranked().map(p => `<span class="chip">${esc(p.name)}</span>`).join('');
      const n = Object.keys(players).length;
      document.getElementById('n').textContent = n ? `${n} player${n === 1 ? '' : 's'}` : 'Waiting for players...';
      document.getElementById('start').disabled = n === 0;
    }

    function next() {
      if (phase === 'question') return;
      if (qi + 1 >= questions.length) return end();
      qi++; answers = {}; phase = 'question'; qStart = Date.now();
      Object.values(players).forEach(p => { p.points = 0; p.correct = false; p.ms = null; });
      const q = cur();
      const msg = { t: 'question', type: q.type || 'choice', level: q.level || '', n: qi, total: questions.length, text: q.text, choices: q.choices || [], seconds: dur() / 1000 };
      bus.send(msg); bus.setState(msg);
      clearTimeout(timer); timer = setTimeout(reveal, dur());
      if (q.type === 'reaction') {
        render(`
        <div class="row"><span class="muted">Round ${qi + 1} of ${questions.length}</span><span class="level">Reaction</span><span class="grow"></span><span id="count" class="muted">0 done</span></div>
        <div class="timer run"><div style="animation-duration:${dur()}ms"></div></div>
        <div class="question">${esc(q.text)}</div>
        <p>On your phone: tap to start, then tap again the instant the box turns green. Fastest tap wins the most points.</p>`);
        return;
      }
      render(`
        <div class="row"><span class="muted">Question ${qi + 1} of ${questions.length}</span>${q.level ? `<span class="level">${esc(q.level)}</span>` : ''}<span class="grow"></span><span id="count" class="muted">0 answered</span></div>
        <div class="timer run"><div style="animation-duration:${dur()}ms"></div></div>
        <div class="question">${esc(q.text)}</div>
        <div class="answers">${q.choices.map((c, i) => answerButton(i, c)).join('')}</div>`);
    }

    function reveal() {
      if (phase !== 'question') return;
      clearTimeout(timer); phase = 'reveal';
      const q = cur(), D = dur();
      if (q.type === 'reaction') {
        const times = [];
        for (const [id, a] of Object.entries(answers)) {
          const p = players[id]; if (!p || !a.ms) continue;
          p.ms = a.ms; p.points = reactionPoints(a.ms); p.score += p.points; times.push({ name: p.name, ms: a.ms });
        }
        times.sort((a, b) => a.ms - b.ms);
        const avg = times.length ? Math.round(times.reduce((s, t) => s + t.ms, 0) / times.length) : 0;
        const best = times.length ? times[0].ms : 0;
        const results = resultsFor();
        bus.send({ t: 'reveal', type: 'reaction', n: qi, results, avg, best });
        bus.setState({ t: 'lobby' });
        render(`
        <div class="row"><span class="muted">Round ${qi + 1} of ${questions.length}</span><span class="level">Reaction</span><span class="grow"></span><button id="next">${qi + 1 >= questions.length ? 'Final results' : 'Next'}</button></div>
        <div class="question">${esc(q.text)}</div>
        <div class="row"><span>Class average <b>${avg} ms</b></span><span class="muted">&middot;</span><span>${times.length} of ${Object.keys(players).length} tapped</span></div>
        <div class="rt-board">${times.slice(0, 6).map((t, i) => `<span>${i + 1}.</span><span>${esc(t.name)}</span><b>${t.ms} ms</b>`).join('')}</div>
        ${q.note ? `<p>${esc(q.note)}</p>` : ''}`);
        document.getElementById('next').onclick = next;
        return;
      }
      const counts = q.choices.map(() => 0);
      for (const [id, a] of Object.entries(answers)) {
        counts[a.choice]++;
        const p = players[id]; if (!p) continue;
        if (a.choice === q.correct) {
          p.correct = true;
          p.points = Math.round(1000 * (1 - Math.min(a.ms, D) / D / 2)); // 1000 instant, 500 at the buzzer
          p.score += p.points;
        }
      }
      const results = resultsFor();
      bus.send({ t: 'reveal', n: qi, correct: q.correct, choices: q.choices, results });
      bus.setState({ t: 'lobby' });
      const top = ranked().slice(0, 5), max = Math.max(1, ...counts);
      render(`
        <div class="row"><span class="muted">Question ${qi + 1} of ${questions.length}</span><span class="grow"></span><button id="next">${qi + 1 >= questions.length ? 'Final results' : 'Next'}</button></div>
        <div class="question">${esc(q.text)}</div>
        <div class="answers" style="flex:0">${q.choices.map((c, i) => answerButton(i, c, i === q.correct ? 'correct' : 'dim').replace('</div>', `<span class="count">${counts[i]}</span></div>`)).join('')}</div>
        ${q.note ? `<p>${esc(q.note)}</p>` : ''}
        <div class="board">${top.map((p, i) => `<span>${i + 1}.</span><span class="row"><span>${esc(p.name)}</span><div class="bar" style="width:${Math.round(p.score / Math.max(1, top[0].score) * 30)}vw"></div></span><b>${p.score}</b>`).join('')}</div>`);
      document.getElementById('next').onclick = next;
    }

    function end() {
      phase = 'end';
      const results = resultsFor(), r = ranked();
      bus.send({ t: 'end', results }); bus.setState({ t: 'lobby' });
      const pod = (p, cls, place) => p ? `<div class="${cls}"><span class="place">${place}</span><span class="name">${esc(p.name)}</span><span class="pts">${p.score}</span></div>` : '';
      render(`
        <h1 class="center">Final results</h1>
        <div class="podium">${pod(r[1], 'p2', '2nd')}${pod(r[0], 'p1', '1st')}${pod(r[2], 'p3', '3rd')}</div>
        <div class="board" style="max-height:30vh;overflow:auto">${r.slice(3).map((p, i) => `<span>${i + 4}.</span><span>${esc(p.name)}</span><b>${p.score}</b>`).join('')}</div>`);
    }

    bus.on(m => {
      if (m.t === 'join') {
        if (!players[m.id]) players[m.id] = { name: m.name, score: 0 };
        else players[m.id].name = m.name;
        bus.send({ t: 'welcome', id: m.id });
        if (phase === 'lobby') renderPlayers();
      } else if (m.t === 'answer' && phase === 'question' && m.q === qi && players[m.id] && !answers[m.id]) {
        answers[m.id] = cur().type === 'reaction' ? { ms: m.ms } : { choice: m.choice, ms: Date.now() - qStart };
        const n = Object.keys(answers).length;
        const c = document.getElementById('count'); if (c) c.textContent = cur().type === 'reaction' ? `${n} done` : `${n} answered`;
        if (n >= Object.keys(players).length) setTimeout(reveal, 400);
      }
    });

    document.addEventListener('keydown', e => {
      if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') {
        e.preventDefault();
        if (phase === 'lobby') { if (Object.keys(players).length) next(); }
        else if (phase === 'reveal') next();
        else if (phase === 'question' && e.key === 'Enter') reveal(); // Enter ends a question early
      }
    });

    lobby();
  }

  // ------------------------------------------------------------------ boot
  const room = params.get('room');
  if (room && !params.get('deck')) runPlayer(room.toUpperCase());
  else runHost();
})();
</script>
</body>
</html>
